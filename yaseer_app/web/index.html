<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="يسير للمبيعات والحسابات — ديون، مبيعات ومخزون بواجهة عربية بسيطة.">
  <meta name="theme-color" content="#087B68">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="يسير">

  <meta property="og:locale" content="ar_AR">
  <meta property="og:type" content="website">
  <meta property="og:title" content="يسير للمبيعات والحسابات">
  <meta property="og:description" content="ابدأ بما تحتاجه فقط، وتوسع وقت ما تحتاج.">

  <link rel="icon" type="image/svg+xml" href="icons/Icon.svg">
  <link rel="manifest" href="manifest.json">

  <title>يسير للمبيعات والحسابات</title>

  <style>
    :root {
      color-scheme: light;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f8f6;
      color: #14332d;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #f5f8f6;
    }

    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 35%, rgba(8, 123, 104, 0.10), transparent 34%),
        #f5f8f6;
      transition: opacity 220ms ease, visibility 220ms ease;
    }

    #boot-splash.is-ready {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .boot-card { text-align: center; }

    .boot-logo {
      width: 88px;
      height: 88px;
      filter: drop-shadow(0 12px 24px rgba(8, 78, 66, 0.16));
    }

    .boot-name {
      margin: 14px 0 4px;
      color: #075f51;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .boot-message {
      margin: 0;
      color: #557069;
      font-size: 14px;
    }

    .boot-progress {
      width: 112px;
      height: 4px;
      margin: 22px auto 0;
      overflow: hidden;
      border-radius: 999px;
      background: #dce8e4;
    }

    .boot-progress::after {
      display: block;
      width: 46%;
      height: 100%;
      border-radius: inherit;
      background: #087b68;
      content: "";
      animation: boot-progress 1.1s ease-in-out infinite alternate;
    }

    @keyframes boot-progress {
      from { transform: translateX(118%); }
      to { transform: translateX(-148%); }
    }

    @media (prefers-reduced-motion: reduce) {
      #boot-splash { transition: none; }
      .boot-progress::after { animation: none; transform: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div id="boot-splash" role="status" aria-live="polite" aria-label="جارٍ تشغيل يسير">
    <div class="boot-card">
      <img class="boot-logo" src="icons/Icon.svg" alt="">
      <p class="boot-name">يسير</p>
      <p class="boot-message">حسابات متجرك… ببساطة</p>
      <div class="boot-progress" aria-hidden="true"></div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('boot-splash');
      if (splash) {
        splash.classList.add('is-ready');
        window.setTimeout(function () { splash.remove(); }, 240);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
